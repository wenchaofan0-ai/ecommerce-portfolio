<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>车商线索与车源匹配助手｜产品原型</title>
<style>
:root{--ink:#14213d;--muted:#697586;--line:#e7ebf2;--blue:#246bfd;--pale:#f4f7fc;--green:#14865c;--orange:#b75c16}*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:var(--ink);font:15px/1.55 "Microsoft YaHei",system-ui,sans-serif}.top{background:#fff;border-bottom:1px solid var(--line);padding:16px max(calc((100vw - 1180px)/2),24px);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:18px}.tag{background:#fff4e9;color:#a34d0e;padding:5px 10px;border-radius:20px;font-size:12px}.wrap{max-width:1180px;margin:28px auto;padding:0 20px}.hero{margin-bottom:22px}.hero h1{margin:0 0 6px;font-size:26px}.hero p{margin:0;color:var(--muted)}.notice{margin-top:14px;background:#fff8e8;border:1px solid #f5dfae;color:#805213;border-radius:10px;padding:10px 14px;font-size:13px}.grid{display:grid;grid-template-columns:370px 1fr;gap:18px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 4px 18px #152d5310}.card h2{font-size:17px;margin:0 0 16px}.samples{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.sample{border:1px solid var(--line);background:white;border-radius:8px;padding:6px 9px;cursor:pointer;color:#344054}.sample:hover{border-color:var(--blue);color:var(--blue)}label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}input,textarea,select{width:100%;border:1px solid #d9dfeb;border-radius:8px;padding:10px;font:inherit;color:var(--ink);background:#fff}textarea{height:105px;resize:vertical}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.btn{border:0;border-radius:9px;padding:11px 16px;background:var(--blue);color:white;font-weight:700;cursor:pointer;width:100%;margin-top:16px}.btn:hover{background:#1558dc}.subtle{font-size:12px;color:var(--muted);margin-top:8px}.empty{min-height:440px;display:grid;place-items:center;color:#8b95a5;text-align:center}.result{display:none}.result.show{display:block}.empty.hide{display:none}.result-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:14px}.result-head h2{margin:0 0 4px}.chip{font-size:12px;padding:4px 8px;border-radius:20px;background:#edf4ff;color:#1d5cce}.score{font-size:24px;font-weight:800;color:var(--blue)}.section{margin-top:18px}.section h3{font-size:14px;margin:0 0 10px}.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kv div,.question,.next{background:var(--pale);border-radius:8px;padding:9px 11px;font-size:13px}.kv span{display:block;color:var(--muted);font-size:11px}.cars{display:grid;gap:9px}.car{border:1px solid var(--line);padding:12px;border-radius:10px}.car-top{display:flex;justify-content:space-between;gap:8px}.car-name{font-weight:700}.car-price{font-weight:700;color:#d74b33}.meta{font-size:12px;color:var(--muted);margin-top:4px}.why{font-size:13px;margin-top:8px}.good{color:var(--green)}.bad{color:var(--orange)}.questions{display:grid;gap:7px}.question:before{content:"待确认 · ";color:#a34d0e;font-weight:700}.next{border-left:3px solid var(--blue)}.foot{font-size:12px;color:var(--muted);padding:18px 2px}@media(max-width:850px){.grid{grid-template-columns:1fr}.empty{min-height:180px}.kv{grid-template-columns:1fr 1fr}}
</style></head><body>
<header class="top"><div class="brand">车商线索与车源匹配助手</div><span class="tag">作品集原型 · v0.1</span></header>
<main class="wrap"><div class="hero"><h1>把零散购车需求，整理成可跟进的匹配建议</h1><p>面向二手车顾问的线索整理与库存初筛工作台</p><div class="notice">演示数据：下方线索、车辆和匹配分数均为模拟内容，非懂车帝内部数据或真实车源。当前为本地规则原型，未接入大模型、线上库存或客户系统。</div></div>
<div class="grid"><section class="card"><h2>① 输入购车线索</h2><div class="samples" id="samples"></div><label for="inquiry">客户原话 / 需求描述</label><textarea id="inquiry" placeholder="例如：预算15万左右，想要空间大点的SUV，家里用，最好三年内的，人在杭州。"></textarea><div class="fields"><div><label>预算上限（万元）</label><input id="budget" type="number" min="1" placeholder="可留空"></div><div><label>意向车型 / 车身</label><input id="model" placeholder="如 SUV"></div><div><label>所在城市</label><input id="city" placeholder="如 杭州"></div><div><label>主要用途</label><input id="use" placeholder="如 家用通勤"></div></div><button class="btn" id="run">分析线索并匹配车源</button><div class="subtle">原型按明确填写的信息筛选；无法确定的条件会列为待确认，不自动补全客户意图。</div></section>
<section class="card"><div class="empty" id="empty">选择一个模拟线索，或填写客户需求，<br>然后点击“分析线索并匹配车源”。</div><div class="result" id="result"></div></section></div><div class="foot">设计原则：先展示证据，再给建议；缺失信息提示人工追问；匹配结果用于顾问初筛，不代替验车、价格核验或销售判断。</div></main>
<script>
const leads=[
{id:'线索 A',text:'预算 15 万上下，想买 SUV，主要家用，后排要宽敞，最好 2022 年以后，杭州。',budget:15,model:'SUV',city:'杭州',use:'家庭出行',must:'后排空间',year:2022},
{id:'线索 B',text:'人在上海，预算 10 万以内，代步通勤，油耗别太高，轿车优先。',budget:10,model:'轿车',city:'上海',use:'日常通勤',must:'燃油经济性',year:2020},
{id:'线索 C',text:'想找一台 20 万左右的新能源 SUV，家里有孩子，安全和空间重要，人在苏州。',budget:20,model:'新能源 SUV',city:'苏州',use:'家庭出行',must:'空间、安全',year:2021},
{id:'线索 D',text:'预算 8 万，第一台车练手，自动挡，平时市区开，南京本地。',budget:8,model:'自动挡轿车',city:'南京',use:'市区代步',must:'自动挡',year:2018}];
const stock=[
{name:'2022款 丰田 RAV4 荣放 2.0L',type:'SUV / 燃油',price:14.6,year:2022,city:'杭州',km:4.8,tag:'空间实用',risk:'具体车况、维修记录待核验'},
{name:'2021款 本田 CR-V 1.5T',type:'SUV / 燃油',price:15.2,year:2021,city:'杭州',km:5.3,tag:'后排空间较好',risk:'年份略早于偏好'},
{name:'2022款 比亚迪 宋PLUS DM-i',type:'SUV / 插混',price:13.9,year:2022,city:'苏州',km:3.6,tag:'家用空间、能耗',risk:'跨城看车需确认'},
{name:'2021款 大众 朗逸 1.5L',type:'轿车 / 燃油',price:8.9,year:2021,city:'上海',km:4.2,tag:'通勤适用',risk:'配置及保养记录待核验'},
{name:'2020款 丰田 卡罗拉 双擎',type:'轿车 / 混动',price:9.8,year:2020,city:'上海',km:6.1,tag:'城市通勤、能耗',risk:'里程和电池状态待核验'},
{name:'2022款 特斯拉 Model Y 后驱',type:'SUV / 纯电',price:19.8,year:2022,city:'苏州',km:4.0,tag:'新能源、空间',risk:'电池健康及保险记录待核验'},
{name:'2021款 吉利 星越L 2.0T',type:'SUV / 燃油',price:13.2,year:2021,city:'杭州',km:5.0,tag:'配置丰富',risk:'年份略早于偏好'},
{name:'2019款 本田 飞度 1.5L',type:'两厢 / 燃油',price:7.5,year:2019,city:'南京',km:6.8,tag:'城市代步',risk:'需确认自动挡及车况'},
{name:'2020款 日产 轩逸 1.6L',type:'轿车 / 燃油',price:8.2,year:2020,city:'南京',km:5.6,tag:'日常代步',risk:'需确认变速箱与保养记录'},
{name:'2023款 埃安 AION Y',type:'SUV / 纯电',price:12.8,year:2023,city:'苏州',km:2.1,tag:'空间、纯电',risk:'电池健康与充电条件待确认'}];
const $=id=>document.getElementById(id);let chosen=null;
leads.forEach(l=>{let b=document.createElement('button');b.className='sample';b.textContent=l.id;b.onclick=()=>{chosen=l;$('inquiry').value=l.text;$('budget').value=l.budget;$('model').value=l.model;$('city').value=l.city;$('use').value=l.use};$('samples').appendChild(b)});
function score(c,q){let s=0,why=[],miss=[];let p=Number(q.budget);if(p){let d=Math.abs(c.price-p);if(c.price<=p){s+=35;why.push('价格在预算内')}else if(d<=1.5){s+=20;why.push('价格略超预算，需确认弹性')}else{miss.push('超预算')}}else miss.push('预算未提供');let m=q.model.trim().toLowerCase();if(m){let terms=m.includes('新能源')?['新能源','纯电','插混','混动']:m.includes('suv')?['suv']:m.includes('轿')?['轿车']:m.includes('自动')?[]:[m];if(!terms.length||terms.some(t=>(c.type+' '+c.name).toLowerCase().includes(t))){s+=25;why.push('车型方向匹配')}else miss.push('车型不匹配')}else miss.push('车型偏好未提供');if(q.city){if(c.city===q.city){s+=20;why.push('同城车源')}else{s+=5;miss.push('异地车源，需确认看车意愿')}}else miss.push('城市未提供');if(Number(q.year)){if(c.year>=Number(q.year)){s+=15;why.push('年份达到偏好')}else{ s+=7;miss.push('年份早于偏好')}}else s+=7;return{score:s,why,miss}}
function render(){let q={budget:$('budget').value,model:$('model').value,city:$('city').value,year:chosen?.year||0};let ranked=stock.map(c=>({c,...score(c,q)})).sort((a,b)=>b.score-a.score).slice(0,3);let missing=[];if(!q.budget)missing.push('可接受的最高落地预算');if(!q.model)missing.push('车型 / 能源类型偏好');if(!q.city)missing.push('看车城市与异地看车意愿');missing.push('是否接受车龄、里程范围');missing.push('是否有必须配置（如自动挡、儿童座椅接口）');$('empty').classList.add('hide');let html=`<div class="result-head"><div><h2>② 线索分析结果</h2><span class="chip">规则匹配 · 顾问需复核</span></div><div class="score">${ranked[0].score}<small style="font-size:12px"> / 100</small></div></div><div class="section"><h3>需求摘要</h3><div class="kv"><div><span>预算</span>${q.budget?'≤ '+q.budget+' 万元':'未提供'}</div><div><span>车型</span>${q.model||'未提供'}</div><div><span>所在城市</span>${q.city||'未提供'}</div><div><span>用途</span>${$('use').value||'待确认'}</div><div><span>线索原话</span>${$('inquiry').value?$('inquiry').value.slice(0,38)+( $('inquiry').value.length>38?'…':''):'未填写'}</div><div><span>处理状态</span>信息待补齐</div></div></div><div class="section"><h3>候选车源（按规则得分排序）</h3><div class="cars">${ranked.map((x,i)=>`<div class="car"><div class="car-top"><span class="car-name">${i+1}. ${x.c.name}</span><span class="car-price">${x.c.price} 万</span></div><div class="meta">${x.c.type} · ${x.c.year} 年 · ${x.c.km} 万公里 · ${x.c.city}（均为模拟字段）</div><div class="why"><span class="good">匹配依据：${x.why.join('；')||'暂无明确匹配项'}</span><br><span class="bad">需核验：${[...x.miss,x.c.risk].join('；')||x.c.risk}</span></div></div>`).join('')}</div></div><div class="section"><h3>建议顾问补问</h3><div class="questions">${missing.map(x=>`<div class="question">${x}</div>`).join('')}</div></div><div class="section"><h3>下一步建议</h3><div class="next">先确认预算是否为裸车价或落地价、是否接受异地车源；再核验车况与手续后联系客户。当前结果仅用于初筛，不应直接承诺车况、价格或可售状态。</div></div>`;$('result').innerHTML=html;$('result').classList.add('show')}
function suggestFields(){let t=$('inquiry').value;let b=t.match(/(?:预算|价格|万左右|万以内|不超过)\s*(\d+(?:\.\d+)?)/);if(b&&!$('budget').value)$('budget').value=b[1];if(!$('model').value){if(/新能源|纯电|插混|混动/.test(t)&&/SUV/.test(t))$('model').value='新能源 SUV';else if(/SUV/i.test(t))$('model').value='SUV';else if(/轿车/.test(t))$('model').value='轿车';else if(/自动挡/.test(t))$('model').value='自动挡轿车'}if(!$('city').value){let m=t.match(/(北京|上海|广州|深圳|杭州|南京|苏州|成都|武汉|重庆|天津|西安|长沙)/);if(m)$('city').value=m[1]}if(!$('use').value){if(/家用|家庭|孩子/.test(t))$('use').value='家庭出行';else if(/通勤|代步|市区/.test(t))$('use').value='日常通勤'}}
$('run').onclick=()=>{if(!$('inquiry').value.trim()&&!$('budget').value&&!$('model').value){alert('请先选一个模拟线索，或至少填写一项需求。');return}suggestFields();render()};
</script></body></html>
